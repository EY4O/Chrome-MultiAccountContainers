<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Containers</title>
  <style>
    body { font: 13px system-ui, sans-serif; width: 280px; margin: 0; padding: 12px; }
    h1 { font-size: 14px; margin: 0 0 8px; }
    .current { color: #555; margin-bottom: 10px; }
    ul { list-style: none; margin: 0 0 12px; padding: 0; }
    li { display: flex; align-items: center; gap: 8px; padding: 4px 0; }
    li .name { flex: 1; }
    .dot { width: 10px; height: 10px; border-radius: 50%; }
    button { font: inherit; cursor: pointer; }
    form { display: flex; gap: 4px; }
    form input { flex: 1; min-width: 0; }
  </style>
</head>
<body>
  <h1>Containers</h1>
  <div class="current" id="current"></div>
  <ul id="list"></ul>
  <form id="create">
    <input name="name" placeholder="New container" required>
    <select name="color"></select>
    <button>Add</button>
  </form>
  <script src="popup.js"></script>
</body>
</html>
