<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Containers settings</title>
  <link rel="icon" href="icons/icon32.png">
  <link rel="stylesheet" href="ui.css">
  <style>
    html { background: var(--surface-low); }
    .topbar { display: flex; align-items: center; gap: 12px; height: 56px; padding: 0 24px; background: var(--surface-low); }
    .topbar img { width: 24px; height: 24px; }
    .topbar h1 { font-size: 20px; line-height: 28px; font-weight: 400; }
    main { max-width: 680px; margin: 0 auto; padding: 12px 16px 48px; display: grid; gap: 28px; }
    section { display: grid; gap: 10px; }
    h2 { font-size: 15px; line-height: 22px; font-weight: 500; padding: 0 4px; }
    .card-row p { overflow-wrap: anywhere; }
    .card-row .title { font-weight: 400; }
    .status-line { margin-top: 4px; }
    .status-ok { color: var(--on-surface-variant); }
    .status-bad { color: var(--error); }
    kbd { font: inherit; font-weight: 500; padding: 0 6px; border-radius: 4px; background: var(--surface-high); color: var(--on-surface); white-space: nowrap; }
    .card { overflow: hidden; }
    .link-row { width: 100%; border: 0; border-top: 1px solid var(--outline-variant); background: transparent; text-align: left; cursor: pointer; transition: background 120ms; }
    .link-row:hover { background: var(--hover); }
    .link-row:focus-visible { outline-offset: -2px; }
    .link-row .icon { color: var(--on-surface-variant); }
    .note { display: flex; gap: 14px; align-items: flex-start; }
    .note .icon { margin-top: 2px; color: var(--on-surface-variant); }
    .locked-note { display: flex; gap: 6px; align-items: center; margin-top: 4px; }
    .card-row > .select { width: 132px; flex: none; }
    .confirm { margin-top: 10px; padding: 12px; border-radius: 12px; background: var(--surface-container); display: grid; gap: 10px; }
    .confirm .buttons { display: flex; justify-content: flex-end; gap: 8px; }
    .locked-note .icon { width: 14px; height: 14px; }
  </style>
</head>
<body>
  <header class="topbar"><img src="icons/icon128.png" alt=""><h1>Containers</h1></header>
  <main id="app" aria-live="polite"></main>
  <script src="options.js"></script>
</body>
</html>
